    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { touch-action: manipulation; -ms-touch-action: manipulation; }
        html, body {
            height: 100%;
            background: #ffffff;
            overflow: hidden;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .progress-top {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            padding-top: env(safe-area-inset-top, 0px);
            background: #ffffff;
        }
        .progress-track {
            width: 100%;
            height: 3px;
            background: #e8e8e8;
            overflow: hidden;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #f14635;
            transform-origin: left center;
            will-change: width;
        }
    </style>
    <script src="common.js"></script>
    <script>
        window.addEventListener("load", function () {
            if (!KaspiApp.isIdDataComplete()) {
                KaspiApp.goTo("id-entry.html", true);
                return;
            }

            var fill = document.getElementById("progress-fill");
            if (!fill) return;

            function setProgress(pct) {
                fill.style.width = Math.min(100, Math.max(0, pct)) + "%";
            }

            setProgress(0);

            window.setTimeout(function () {
                fill.style.transition = "width 0.08s cubic-bezier(0.25, 0.1, 0.25, 1)";
                setProgress(20);
            }, 20);

            window.setTimeout(function () {
                fill.style.transition = "width 0.12s cubic-bezier(0.22, 0.61, 0.36, 1)";
                setProgress(35);
            }, 20 + 40);

            window.setTimeout(function () {
                KaspiApp.goTo("id-loading.html", true, "forward");
            }, 20 + 40 + 60);
        });
    </script>

<body>
    <div class="progress-top" aria-hidden="true">
        <div class="progress-track">
            <div id="progress-fill" class="progress-fill"></div>
        </div>
    </div>
</body>
