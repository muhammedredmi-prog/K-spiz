<script src="assets/qrcode.min.js"></script>
<script>
    var activeTab = 'doc';
    var swipeStartX = 0;
    var swipeStartY = 0;
    var swipeTracking = false;
    var swipeLocked = false;
    var swipeGestureCommitted = false;
    var dragOffset = 0;
    var photoZoomScale = 1;
    var photoZoomPanX = 0;
    var photoZoomPanY = 0;
    var photoMaxScale = 5;

    function getSwipeCommitThreshold(viewport) {
        return Math.max(viewport.clientWidth * 0.15, 40);
    }

    function getZoomedEdgeSwipeThreshold(viewport) {
        return viewport.clientWidth * 0.25;
    }

    function getPhotoMinPanX(viewport, inner) {
        var vpW = viewport.clientWidth;
        var contentW = inner.offsetWidth * photoZoomScale;
        return contentW <= vpW ? (vpW - contentW) / 2 : vpW - contentW;
    }

    function isPhotoAtRightEdge(viewport, inner) {
        return photoZoomPanX <= getPhotoMinPanX(viewport, inner) + 3;
    }

    function resolveTabSwipe(dx, viewport) {
        var commit = getSwipeCommitThreshold(viewport);

        if (activeTab === 'doc' && dx <= -commit) {
            switchTab('rekv');
            return;
        }
        if (activeTab === 'rekv' && dx >= commit) {
            switchTab('doc');
            return;
        }
        dragOffset = 0;
        applyTrackPosition(true);
    }

    function tryZoomedEdgeTabSwipe(panDx, viewport, inner, photoViewport, startedAtRightEdge) {
        if (activeTab !== 'doc' || photoZoomScale <= 1.02) return;
        if (!startedAtRightEdge) return;
        if (!isPhotoAtRightEdge(photoViewport, inner) || panDx >= 0) return;

        var threshold = getZoomedEdgeSwipeThreshold(viewport);
        if (panDx <= -threshold) {
            dragOffset = 0;
            switchTab('rekv');
        }
    }

    (function bootstrapIdForm() {
        // Проверяем общую сессию аутентификации
        if (!KaspiApp.isAuthSessionValid()) {
            KaspiApp.goTo('index.html', true, 'back');
            return;
        }

        // Устанавливаем флаг для отключения скелетона при возврате на gov.html
        try {
            sessionStorage.setItem('kaspi_skip_gov_skeleton', 'true');
        } catch (err) {
            /* ignore */
        }
        
        if (!KaspiApp.isIdDataComplete()) {
            KaspiApp.goTo('id-entry.html', true);
            return;
        }
        initPage();
        initPhotoZoom();
        initSwipe();
        initPresentSheetDrag();
        applyTrackPosition(true);
    })();

    function initPage() {
        var data = KaspiApp.getIdData();
        if (data.fio) document.getElementById('rv-fio').innerText = data.fio;
        if (data.iin) document.getElementById('rv-iin').innerText = data.iin;
        if (data.dob) document.getElementById('rv-dob').innerText = data.dob;
        if (data.docnum) document.getElementById('rv-docnum').innerText = data.docnum;
        if (data.issue) document.getElementById('rv-issue').innerText = data.issue;
        if (data.expiry) document.getElementById('rv-expiry').innerText = data.expiry;

        var savedPhoto = window.__KASPI_ID_PHOTO__ || KaspiApp.getIdPhoto();
        if (savedPhoto) {
            showPhoto(savedPhoto);
        }

        var pdf = KaspiApp.getIdPdf();
        if (pdf.data) showPdf();
    }

    function showPhoto(src) {
        var img = document.getElementById('preview-img');
        img.src = src;
        document.documentElement.classList.add('has-id-photo');
        document.getElementById('photo-preview').classList.add('visible');
        document.getElementById('upload-photo-row').classList.add('hidden');
        document.getElementById('panel-doc').classList.add('panel-doc--photo');
        resetPhotoZoom();
    }

    function resetPhotoZoom() {
        photoZoomScale = 1;
        photoZoomPanX = 0;
        photoZoomPanY = 0;
        applyPhotoZoomTransform();
    }

    function applyPhotoZoomTransform() {
        var inner = document.getElementById('photo-zoom-inner');
        if (!inner) return;
        inner.style.transformOrigin = '0 0';
        inner.style.transform =
            'translate(' + photoZoomPanX + 'px, ' + photoZoomPanY + 'px) scale(' + photoZoomScale + ')';
    }

    function initPhotoZoom() {
        var viewport = document.getElementById('photo-zoom-viewport');
        var inner = document.getElementById('photo-zoom-inner');
        if (!viewport || !inner) return;
        var pinchStart = null;
        var isPinching = false;
        var isPanning = false;
        var panTouchStartX = 0;
        var panTouchStartY = 0;
        var panOriginX = 0;
        var panOriginY = 0;
        var panStartedAtRightEdge = false;
        function touchDistance(touches) {
            var dx = touches[0].clientX - touches[1].clientX;
            var dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function focalPoint(touches) {
            var rect = viewport.getBoundingClientRect();
            return {
                x: (touches[0].clientX + touches[1].clientX) / 2 - rect.left,
                y: (touches[0].clientY + touches[1].clientY) / 2 - rect.top,
            };
        }

        function clampPan() {
            var vpW = viewport.clientWidth;
            var vpH = viewport.clientHeight;
            var contentW = inner.offsetWidth * photoZoomScale;
            var contentH = inner.offsetHeight * photoZoomScale;

            if (contentW <= vpW) {
                photoZoomPanX = (vpW - contentW) / 2;
            } else {
                photoZoomPanX = Math.min(0, Math.max(vpW - contentW, photoZoomPanX));
            }

            if (contentH <= vpH) {
                photoZoomPanY = (vpH - contentH) / 2;
            } else {
                photoZoomPanY = Math.min(0, Math.max(vpH - contentH, photoZoomPanY));
            }
        }

        function scaleAroundPoint(newScale, fx, fy) {
            var oldScale = photoZoomScale;
            if (oldScale < 0.001) oldScale = 1;
            photoZoomPanX = fx - (fx - photoZoomPanX) * (newScale / oldScale);
            photoZoomPanY = fy - (fy - photoZoomPanY) * (newScale / oldScale);
            photoZoomScale = newScale;
        }

        viewport.addEventListener('touchstart', function (e) {
            if (e.touches.length === 2) {
                isPinching = true;
                isPanning = false;
                swipeLocked = true;
                var focal = focalPoint(e.touches);
                pinchStart = {
                    dist: touchDistance(e.touches),
                    scale: photoZoomScale,
                    panX: photoZoomPanX,
                    panY: photoZoomPanY,
                    fx: focal.x,
                    fy: focal.y,
                };
                e.preventDefault();
            } else if (e.touches.length === 1 && photoZoomScale > 1.02) {
                if (e.touches[0].clientX <= 22) return;
                isPanning = true;
                swipeLocked = true;
                swipeGestureCommitted = false;
                panTouchStartX = e.touches[0].clientX;
                panTouchStartY = e.touches[0].clientY;
                panOriginX = photoZoomPanX;
                panOriginY = photoZoomPanY;
                panStartedAtRightEdge = isPhotoAtRightEdge(viewport, inner);
            }
        }, { passive: false });

        viewport.addEventListener('touchmove', function (e) {
            if (isPinching && e.touches.length === 2 && pinchStart) {
                var dist = touchDistance(e.touches);
                if (pinchStart.dist > 0) {
                    var newScale = Math.min(
                        photoMaxScale,
                        Math.max(0.3, pinchStart.scale * (dist / pinchStart.dist))
                    );
                    photoZoomPanX = pinchStart.panX;
                    photoZoomPanY = pinchStart.panY;
                    photoZoomScale = pinchStart.scale;
                    scaleAroundPoint(newScale, pinchStart.fx, pinchStart.fy);
                    inner.style.transition = 'none';
                    if (photoZoomScale < 1) {
                        applyPhotoZoomTransform();
                    } else {
                        applyPhotoZoomTransform();
                    }
                }
                e.preventDefault();
            } else if (isPanning && e.touches.length === 1 && photoZoomScale > 1.02) {
                inner.style.transition = 'none';
                photoZoomPanX = panOriginX + (e.touches[0].clientX - panTouchStartX);
                photoZoomPanY = panOriginY + (e.touches[0].clientY - panTouchStartY);
                clampPan();
                applyPhotoZoomTransform();
                e.preventDefault();
            }
        }, { passive: false });

        viewport.addEventListener('touchend', function (e) {
            if (isPinching && e.touches.length < 2) {
                isPinching = false;
                // Если масштаб меньше 1, возвращаем к 1 с плавной анимацией
                if (photoZoomScale < 1) {
                    inner.style.transition = 'transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                    photoZoomScale = 1;
                    photoZoomPanX = 0;
                    photoZoomPanY = 0;
                    applyPhotoZoomTransform();
                    swipeLocked = false;
                } else {
                    inner.style.transition = 'transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                }
                pinchStart = null;
            }
            if (isPanning && e.touches.length === 0) {
                var swipeViewport = document.getElementById('swipe-viewport');
                if (swipeViewport) {
                    var panDx = e.changedTouches[0].clientX - panTouchStartX;
                    tryZoomedEdgeTabSwipe(panDx, swipeViewport, inner, viewport, panStartedAtRightEdge);
                }
                panStartedAtRightEdge = false;
                isPanning = false;
            }
            if (e.touches.length === 0) {
                if (photoZoomScale <= 1.02) {
                    resetPhotoZoom();
                    swipeLocked = false;
                } else {
                    inner.style.transition = 'transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                    clampPan();
                    applyPhotoZoomTransform();
                    swipeLocked = true;
                }
            }
        });

        viewport.addEventListener('dblclick', function (e) {
            var rect = viewport.getBoundingClientRect();
            var fx = e.clientX - rect.left;
            var fy = e.clientY - rect.top;
            if (photoZoomScale > 1.02) {
                resetPhotoZoom();
            } else {
                scaleAroundPoint(2.5, fx, fy);
                clampPan();
                applyPhotoZoomTransform();
            }
            swipeLocked = photoZoomScale > 1.02;
        });
    }

    function showPdf() {
        document.documentElement.classList.add('has-id-pdf');
        document.getElementById('upload-pdf-row').classList.add('hidden');
    }

    function uploadPhoto(input) {
        var file = input.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (e) {
            KaspiApp.setIdPhoto(e.target.result);
            showPhoto(e.target.result);
            showToast('Фото загружено');
        };
        reader.readAsDataURL(file);
    }

    function uploadPdf(input) {
        var file = input.files[0];
        if (!file) return;
        if (file.type && file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
            showToast('Выберите PDF файл');
            return;
        }
        var reader = new FileReader();
        reader.onload = function (e) {
            KaspiApp.setIdPdf(file.name, e.target.result);
            var existingRandom = KaspiApp.getIdPdfRandom();
            if (!existingRandom) {
                var random = String(Math.floor(100000000 + Math.random() * 900000000));
                KaspiApp.setIdPdfRandom(random);
            }
            showPdf();
            showToast('PDF загружен');
        };
        reader.readAsDataURL(file);
    }

    function switchTab(tabName, animate) {
        if (tabName !== activeTab) {
            resetPhotoZoom();
            swipeLocked = false;
        }
        activeTab = tabName;
        dragOffset = 0;
        document.querySelectorAll('.tab').forEach(function (t) {
            t.classList.toggle('active', t.dataset.tab === tabName);
        });
        updateBottomBar(tabName);
        applyTrackPosition(animate !== false);
    }

    function updateBottomBar(tabName) {
        var isDoc = tabName === 'doc';
        document.getElementById('bottom-doc').classList.toggle('hidden', !isDoc);
        document.getElementById('bottom-rekv').classList.toggle('hidden', isDoc);
    }

    function applyTrackPosition(useTransition) {
        var track = document.getElementById('swipe-track');
        var viewport = document.getElementById('swipe-viewport');
        var indicator = document.getElementById('tab-indicator');
        var panelWidth = viewport.clientWidth;
        var base = activeTab === 'rekv' ? -panelWidth : 0;
        if (useTransition === false) {
            track.classList.add('dragging');
            if (indicator) indicator.classList.add('dragging');
        } else {
            track.classList.remove('dragging');
            if (indicator) indicator.classList.remove('dragging');
        }
        track.style.transform = 'translateX(' + (base + dragOffset) + 'px)';
        
        // Sync tab indicator with swipe position
        if (indicator) {
            var tabsContainer = document.querySelector('.tabs');
            var tabsWidth = tabsContainer ? tabsContainer.clientWidth : panelWidth;
            var tabWidth = tabsWidth / 2; // Each tab is half the tabs container
            var indicatorOffset = 0;
            if (activeTab === 'rekv') {
                indicatorOffset = tabWidth - 2; // Move left slightly less to reduce right gap
            }
            // The indicator should move in opposite direction to track swipe
            // When swiping left (negative dragOffset), indicator should move right
            var indicatorDrag = -(dragOffset / panelWidth) * tabWidth;
            indicator.style.transform = 'translateX(' + (indicatorOffset + indicatorDrag) + 'px)';
        }
    }

    function initSwipe() {
        var viewport = document.getElementById('swipe-viewport');

        document.querySelectorAll('.tab').forEach(function (tab) {
            tab.addEventListener('click', function () {
                switchTab(tab.dataset.tab);
            });
        });

        viewport.addEventListener('touchstart', function (e) {
            if (e.touches.length !== 1) return;
            if (e.touches[0].clientX <= 22) return;
            if (swipeLocked || photoZoomScale > 1.02) {
                swipeTracking = false;
                return;
            }
            swipeStartX = e.touches[0].clientX;
            swipeStartY = e.touches[0].clientY;
            swipeTracking = true;
            swipeGestureCommitted = false;
            dragOffset = 0;
        }, { passive: true });

        viewport.addEventListener('touchmove', function (e) {
            if (!swipeTracking || swipeLocked) return;
            var dx = e.touches[0].clientX - swipeStartX;
            var dy = e.touches[0].clientY - swipeStartY;
            if (!swipeGestureCommitted) {
                if (Math.abs(dx) < 14) return;
                if (Math.abs(dx) < Math.abs(dy) * 1.4) {
                    swipeTracking = false;
                    dragOffset = 0;
                    return;
                }
                swipeGestureCommitted = true;
                applyTrackPosition(false);
            }
            var panelWidth = viewport.clientWidth;
            if (activeTab === 'doc') {
                dragOffset = Math.min(0, Math.max(-panelWidth, dx));
            } else {
                dragOffset = Math.max(0, Math.min(panelWidth, dx));
            }
            applyTrackPosition(false);
            e.preventDefault();
        }, { passive: false });

        viewport.addEventListener('touchend', function (e) {
            if (!swipeTracking) return;
            swipeTracking = false;
            if (!swipeGestureCommitted) {
                dragOffset = 0;
                return;
            }
            var dx = e.changedTouches[0].clientX - swipeStartX;
            resolveTabSwipe(dx, viewport);
        }, { passive: true });

        window.addEventListener('resize', function () {
            applyTrackPosition(true);
        });
    }

    function dataUrlToBlob(dataUrl) {
        var parts = dataUrl.split(',');
        var mime = parts[0].match(/:(.*?);/)[1];
        var binary = atob(parts[1]);
        var len = binary.length;
        var arr = new Uint8Array(len);
        for (var i = 0; i < len; i++) arr[i] = binary.charCodeAt(i);
        return new Blob([arr], { type: mime });
    }

    function getPdfFile() {
        var pdf = KaspiApp.getIdPdf();
        if (!pdf.data) return null;
        var blob = dataUrlToBlob(pdf.data);
        
        var data = KaspiApp.getIdData();
        var iin = data.iin || '';
        
        var now = new Date();
        var year = now.getFullYear();
        var month = String(now.getMonth() + 1).padStart(2, '0');
        var day = String(now.getDate()).padStart(2, '0');
        var dateStr = year + month + day;
        
        var random = KaspiApp.getIdPdfRandom() || '000000000';
        
        var fileName = iin + '-' + dateStr + random + '.pdf';
        
        return new File([blob], fileName, { type: 'application/pdf' });
    }

    function shareDoc() {
        var file = getPdfFile();
        if (!file) {
            showToast('Сначала загрузите PDF');
            return;
        }
        if (!navigator.share) {
            showToast('Поделиться недоступно в этом браузере');
            return;
        }
        var payload = { files: [file] };
        if (navigator.canShare && !navigator.canShare(payload)) {
            showToast('Не удалось открыть меню «Поделиться»');
            return;
        }
        navigator.share(payload).catch(function (err) {
            if (err && err.name !== 'AbortError') {
                showToast('Не удалось поделиться');
            }
        });
    }

    function copyText(id) {
        var text = document.getElementById(id).innerText;
        if (text && text !== '—') {
            KaspiApp.copyToClipboard(text).then(function (ok) {
                if (ok) showToast('Скопировано');
            });
        }
    }

    function randomSixDigitCode() {
        return String(Math.floor(100000 + Math.random() * 900000));
    }

    function buildPresentPayload(code) {
        return 'https://kaspi.kz';
    }

    function getPresentQrOptions() {
        return {
            errorCorrectionLevel: 'Q',
            version: 5,
            width: 160,
            margin: 4,
            color: { dark: '#000000', light: '#ffffff' }
        };
    }

    function renderPresentQr(payload) {
        var container = document.getElementById('present-qr');
        if (!container) return;
        container.innerHTML = '';

        if (typeof QRCode === 'undefined') {
            container.textContent = 'QR-код недоступен';
            return;
        }

        var opts = getPresentQrOptions();
        try {
            QRCode.create(payload, { errorCorrectionLevel: 'H' });
        } catch (createErr) {
            container.textContent = 'QR-код недоступен';
            return;
        }

        var canvas = document.createElement('canvas');
        canvas.setAttribute('data-ec-level', 'H');
        canvas.setAttribute('aria-label', 'QR-код, уровень коррекции H');

        QRCode.toCanvas(canvas, payload, opts, function (err) {
            if (!err) {
                container.appendChild(canvas);
                return;
            }
            QRCode.toDataURL(payload, opts, function (err2, url) {
                if (err2 || !url) {
                    container.textContent = 'QR-код недоступен';
                    return;
                }
                var img = document.createElement('img');
                img.src = url;
                img.alt = 'QR-код';
                img.width = 176;
                img.height = 176;
                img.setAttribute('data-ec-level', 'H');
                container.appendChild(img);
            });
        });
    }

    function resetPresentSheetDragStyles() {
        var sheet = document.getElementById('present-sheet');
        var backdrop = document.getElementById('present-backdrop');
        if (sheet) sheet.style.transform = '';
        if (backdrop) backdrop.style.opacity = '';
    }

    function initPresentSheetDrag() {
        var sheet = document.getElementById('present-sheet');
        var backdrop = document.getElementById('present-backdrop');
        var handle = document.getElementById('present-sheet-handle');
        if (!sheet || !backdrop || !handle) return;

        var dragStartY = 0;
        var dragOffsetY = 0;
        var sheetDragActive = false;

        handle.addEventListener('touchstart', function (e) {
            if (e.target.closest('.present-close')) return;
            if (!sheet.classList.contains('open') || e.touches.length !== 1) return;
            sheetDragActive = true;
            dragStartY = e.touches[0].clientY;
            dragOffsetY = 0;
            sheet.classList.add('dragging');
        }, { passive: true });

        handle.addEventListener('touchmove', function (e) {
            if (!sheetDragActive || e.touches.length !== 1) return;
            var dy = e.touches[0].clientY - dragStartY;
            if (dy < 0) dy = 0;
            dragOffsetY = dy;
            sheet.style.transform = 'translateY(' + dy + 'px)';
            var fade = Math.max(0, 1 - dy / 280);
            backdrop.style.opacity = String(fade);
            e.preventDefault();
        }, { passive: false });

        function endSheetDrag() {
            if (!sheetDragActive) return;
            sheetDragActive = false;
            sheet.classList.remove('dragging');
            var threshold = Math.min(100, sheet.offsetHeight * 0.2);
            if (dragOffsetY > threshold) {
                resetPresentSheetDragStyles();
                closePresentSheet();
            } else {
                resetPresentSheetDragStyles();
            }
            dragOffsetY = 0;
        }

        handle.addEventListener('touchend', endSheetDrag, { passive: true });
        handle.addEventListener('touchcancel', endSheetDrag, { passive: true });
    }

    function openPresentSheet() {
        var code = randomSixDigitCode();
        var backdrop = document.getElementById('present-backdrop');
        var sheet = document.getElementById('present-sheet');
        var bottomDoc = document.getElementById('bottom-doc');

        resetPresentSheetDragStyles();
        document.getElementById('present-code').textContent = code;
        document.getElementById('present-qr').innerHTML = '';
        if (bottomDoc) bottomDoc.classList.add('hidden');

        backdrop.classList.add('open');
        backdrop.setAttribute('aria-hidden', 'false');
        sheet.classList.add('open');
        sheet.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';

        renderPresentQr(buildPresentPayload(code));
    }

    function closePresentSheet() {
        var backdrop = document.getElementById('present-backdrop');
        var sheet = document.getElementById('present-sheet');
        var bottomDoc = document.getElementById('bottom-doc');
        var loadingOverlay = document.getElementById('loading-overlay');

        resetPresentSheetDragStyles();
        backdrop.classList.remove('open');
        backdrop.setAttribute('aria-hidden', 'true');
        sheet.classList.remove('open');
        sheet.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        if (loadingOverlay) loadingOverlay.classList.remove('show');
        if (bottomDoc && activeTab === 'doc') bottomDoc.classList.remove('hidden');

        sheet.addEventListener('transitionend', function onEnd(e) {
            if (e.propertyName !== 'transform' || sheet.classList.contains('open')) return;
            document.getElementById('present-qr').innerHTML = '';
            document.getElementById('present-code').textContent = '';
            sheet.removeEventListener('transitionend', onEnd);
        });
    }

    function presentDoc() {
        var loadingOverlay = document.getElementById('loading-overlay');
        if (loadingOverlay) {
            loadingOverlay.classList.add('show');
            document.body.style.overflow = 'hidden';
        }
        
        setTimeout(function() {
            if (loadingOverlay) {
                loadingOverlay.classList.remove('show');
            }
            openPresentSheet();
        }, 300);
    }

    function shareRekv() {
        var data = KaspiApp.getIdData();
        var text = [
            'ФИО: ' + (data.fio || ''),
            'ИИН: ' + (data.iin || ''),
            'Дата рождения: ' + (data.dob || ''),
            'Номер документа: ' + (data.docnum || ''),
            'Дата выдачи: ' + (data.issue || ''),
            'Срок действия: ' + (data.expiry || '')
        ].join('\n');
        if (navigator.share) {
            navigator.share({ title: 'Реквизиты', text: text }).catch(function () {});
        } else {
            KaspiApp.copyToClipboard(text).then(function (ok) {
                if (ok) showToast('Реквизиты скопированы');
            });
        }
    }

    function showToast(msg) {
        var toast = document.getElementById('toast');
        var textEl = document.getElementById('toast-text');
        var iconEl = document.getElementById('toast-icon');
        if (!toast) return;
        var isCopy = /скопир/i.test(msg);
        if (textEl) {
            textEl.textContent = msg;
        }
        if (iconEl) {
            iconEl.style.display = isCopy ? 'block' : 'none';
        }
        toast.classList.add('show');
        setTimeout(function () { toast.classList.remove('show'); }, 2000);
    }
</script>
