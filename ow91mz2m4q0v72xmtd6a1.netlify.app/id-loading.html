    <script>
        KaspiApp.applyIdDocPreparedState();
        window.addEventListener("load", function () {
            if (!KaspiApp.isIdDataComplete()) {
                KaspiApp.goTo("id-entry.html", true);
                return;
            }
            var navigateToForm = function () {
                KaspiApp.goTo("id-form.html", true, "forward");
