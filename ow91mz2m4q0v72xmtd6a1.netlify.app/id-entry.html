<body>
    <header class="page-header">
        <button class="back-btn" onclick="KaspiApp.goBack('index.html')">
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span class="page-title">Удостоверение личности</span>
    </header>

    <div class="form-body">
        <div class="field-group">
            <span class="field-label">ФИО</span>
            <input id="f-fio" type="text" class="field-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </div>
        <div class="field-group">
            <span class="field-label">Упрощённое имя</span>
            <input id="f-shortname" type="text" class="field-input" placeholder="Как показывать в пин-коде" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </div>
        <div class="field-group">
            <span class="field-label">ИИН</span>
            <input id="f-iin" type="text" class="field-input" inputmode="numeric" maxlength="12">
        </div>
        <div class="field-group">
            <span class="field-label">Дата рождения</span>
            <input id="f-dob" type="text" class="field-input" placeholder="ДД.ММ.ГГГГ" inputmode="numeric">
        </div>
        <div class="field-group">
            <span class="field-label">Номер документа</span>
            <input id="f-docnum" type="text" class="field-input" inputmode="numeric">
        </div>
        <div class="field-group">
            <span class="field-label">Дата выдачи</span>
            <input id="f-issue" type="text" class="field-input" placeholder="ДД.ММ.ГГГГ" inputmode="numeric">
        </div>
        <div class="field-group">
            <span class="field-label">Срок действия</span>
            <input id="f-expiry" type="text" class="field-input" placeholder="ДД.ММ.ГГГГ" inputmode="numeric">
        </div>
    </div>

    <button class="save-btn" onclick="saveData()">
        Сохранить
        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>

    <script src="common.js"></script>
    <script>
        document.querySelectorAll('input[placeholder="ДД.ММ.ГГГГ"]').forEach(function(input) {
            input.addEventListener('input', function(e) {
                let val = e.target.value.replace(/\D/g, '');
                if (val.length > 2) val = val.slice(0,2) + '.' + val.slice(2);
                if (val.length > 5) val = val.slice(0,5) + '.' + val.slice(5);
                if (val.length > 10) val = val.slice(0,10);
                e.target.value = val;
            });
        });

        window.addEventListener('load', function() {
            
            const data = KaspiApp.getIdData();
            if (data.fio) document.getElementById('f-fio').value = data.fio;
            if (data.shortname) document.getElementById('f-shortname').value = data.shortname;
            if (data.iin) document.getElementById('f-iin').value = data.iin;
            if (data.dob) document.getElementById('f-dob').value = data.dob;
            if (data.docnum) document.getElementById('f-docnum').value = data.docnum;
            if (data.issue) document.getElementById('f-issue').value = data.issue;
            if (data.expiry) document.getElementById('f-expiry').value = data.expiry;
        });

        function saveData() {
            const data = {
                fio: document.getElementById('f-fio').value.trim(),
                shortname: document.getElementById('f-shortname').value.trim(),
                iin: document.getElementById('f-iin').value.trim(),
                dob: document.getElementById('f-dob').value.trim(),
                docnum: document.getElementById('f-docnum').value.trim(),
                issue: document.getElementById('f-issue').value.trim(),
                expiry: document.getElementById('f-expiry').value.trim(),
            };
            if (!data.fio || !data.iin || !data.dob || !data.docnum || !data.issue || !data.expiry) {
                alert('Заполните все поля');
                return;
            }
            KaspiApp.setIdData(data);
            KaspiApp.goBack('index.html');
        }
    </script>
</body>
