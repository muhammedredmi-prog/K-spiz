<script>
    function handleBankBack() {
        var content = document.querySelector('.bank-content');
        if (content) {
            content.classList.add('fade-out');
            setTimeout(function() {
                KaspiApp.goBack('index.html');
            }, 300);
        } else {
            KaspiApp.goBack('index.html');
        }
    }

    window.addEventListener("DOMContentLoaded", function() {
        // Проверяем общую сессию аутентификации
        if (!KaspiApp.isAuthSessionValid()) {
            KaspiApp.goTo("index.html", true, "back");
            return;
        }
        
        // Предзагружаем index.html для быстрого возврата назад
        var preloadLink = document.createElement('link');
        preloadLink.rel = 'prefetch';
        preloadLink.href = 'index.html';
        document.head.appendChild(preloadLink);
        
        var skeleton = document.getElementById('bank-skeleton');
        if (!skeleton) return;

        // Всегда показываем скелетон для плавной загрузки
        skeleton.classList.remove('skeleton-fade-out');
        document.body.classList.add('skeleton-active');

        // Загружаем последние 4 цифры карты из секретного меню
        loadBankCardLastDigits();

        // Используем умный скелетон с авто-таймером и предзагрузкой
        KaspiApp.initSmartSkeleton('bank-skeleton', function(markReady) {
            // Предзагружаем контент в фоне
            var imagesToPreload = document.querySelectorAll('.bank-card-icon, .bank-card--deposit-icon img');
            var imagesLoaded = 0;
            var totalImages = imagesToPreload.length;

            if (totalImages === 0) {
                markReady();
                return;
            }

            imagesToPreload.forEach(function(img) {
                if (img.complete) {
                    imagesLoaded++;
                    if (imagesLoaded === totalImages) {
                        markReady();
                    }
                } else {
                    img.onload = function() {
                        imagesLoaded++;
                        if (imagesLoaded === totalImages) {
                            markReady();
                        }
                    };
                    img.onerror = function() {
                        imagesLoaded++;
                        if (imagesLoaded === totalImages) {
                            markReady();
                        }
                    };
                }
            });

            // Таймаут на случай если изображения не загрузятся
            setTimeout(function() {
                markReady();
            }, 500);
        });
    });

    function loadBankCardLastDigits() {
        try {
            var data = JSON.parse(localStorage.getItem('kaspi_secret_card_data') || '{}');
            var cardNumber = data.cardNumber || '';
            var lastDigits = '';

            if (cardNumber) {
                // Убираем пробелы и берем последние 4 цифры
                var cleanNumber = cardNumber.replace(/\s/g, '');
                if (cleanNumber.length >= 4) {
                    lastDigits = cleanNumber.slice(-4);
                }
            }

            var lastDigitsElement = document.getElementById('bank-card-last-digits');
            if (lastDigitsElement) {
                lastDigitsElement.textContent = lastDigits ? '• ' + lastDigits : '• • • •';
            }

            // Load balances from localStorage
            var goldBalance = localStorage.getItem('kaspi_gold_balance') || '8 410 ₸';
            var depositBalance = localStorage.getItem('kaspi_deposit_balance') || '1 000 ₸';
            var bonusBalance = localStorage.getItem('kaspi_bonus_balance') || '170,51 ₸';

            var goldBalanceElement = document.querySelector('.bank-card--clickable .bank-card-balance');
            if (goldBalanceElement) {
                goldBalanceElement.textContent = goldBalance;
            }

            var depositBalanceElement = document.querySelector('.bank-card-balance--deposit');
            if (depositBalanceElement) {
                depositBalanceElement.textContent = depositBalance;
            }

            var bonusBalanceElement = document.querySelector('.bank-card-balance--bonus');
            if (bonusBalanceElement) {
                // Remove the old balance and add new one with bonus letter
                bonusBalanceElement.innerHTML = bonusBalance + ' <span class="bonus-letter">Б</span>';
            }
        } catch (e) {
            console.error('Failed to load bank card last digits:', e);
        }
    }
</script>
